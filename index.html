<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Live rankings of the best burger restaurants in Doha, Qatar. Vote and see real-time leaderboard.">
    <title>Burger Qatar - Doha's Burger Leaderboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="branding">
                <h1 class="logo">🍔 Burger Qatar</h1>
                <p class="tagline">Doha's Burger Leaderboard</p>
            </div>
            <div class="header-stats">
                <div class="stat-box">
                    <span class="stat-value" id="totalVotes">0</span>
                    <span class="stat-label">Total Votes</span>
                </div>
                <div class="stat-box">
                    <span class="stat-value" id="totalRestaurants">10</span>
                    <span class="stat-label">Restaurants</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Leaderboard -->
    <main class="main-container">
        <div class="leaderboard-wrapper">

            <!-- Top 3 Podium -->
            <div class="podium-compact" id="podiumCompact">
                <div style="padding: 2rem; text-align: center; color: #999;">Loading top 3...</div>
            </div>

            <!-- Filters -->
            <div class="controls">
                <div class="filter-tabs">
                    <button class="tab-btn active" data-filter="all">All Rankings</button>
                    <button class="tab-btn" data-filter="rising">Rising Stars</button>
                    <button class="tab-btn" data-sort="votes">Most Voted</button>
                </div>
            </div>

            <!-- Leaderboard Table -->
            <div class="leaderboard" id="leaderboard">
                <div style="padding: 3rem; text-align: center; color: #999;">Loading rankings...</div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-compact">
        <p>&copy; 2025 Burger Qatar | <a href="https://burgerqa.com">burgerqa.com</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
