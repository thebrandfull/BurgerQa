<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Burger Qatar</title>
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h1>🍔 Burger Qatar Admin</h1>
            <p class="login-subtitle">Dashboard Access</p>
            <form id="loginForm" onsubmit="return false;">
                <input type="password" id="adminPassword" placeholder="Enter admin password" required>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <p class="login-hint">Default password: <strong>burgerqatar2025</strong></p>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div class="admin-dashboard" id="adminDashboard" style="display: none;">
        <!-- Header -->
        <header class="admin-header">
            <div class="admin-header-content">
                <h1>🍔 Burger Qatar - Admin Dashboard</h1>
                <div class="admin-actions">
                    <button onclick="window.open('index.html', '_blank')" class="btn-secondary">View Site</button>
                    <button onclick="logout()" class="btn-logout">Logout</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="admin-container">
            <!-- Stats Overview -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">🍔</div>
                    <div class="stat-info">
                        <div class="stat-value" id="totalRestaurantsAdmin">0</div>
                        <div class="stat-label">Total Restaurants</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👍</div>
                    <div class="stat-info">
                        <div class="stat-value" id="totalVotesAdmin">0</div>
                        <div class="stat-label">Total Votes</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⭐</div>
                    <div class="stat-info">
                        <div class="stat-value" id="avgRatingAdmin">0</div>
                        <div class="stat-label">Avg Rating</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🏆</div>
                    <div class="stat-info">
                        <div class="stat-value" id="topRestaurantAdmin">-</div>
                        <div class="stat-label">Top Restaurant</div>
                    </div>
                </div>
            </div>

            <!--Add Restaurant Form -->
            <div class="admin-section">
                <div class="section-header">
                    <h2>Add New Restaurant</h2>
                    <button onclick="resetForm()" class="btn-secondary">Reset Form</button>
                </div>
                <form id="restaurantForm" class="restaurant-form">
                    <input type="hidden" id="restaurantId">

                    <div class="form-row">
                        <div class="form-group">
                            <label>Restaurant Name *</label>
                            <input type="text" id="restaurantName" required>
                        </div>
                        <div class="form-group">
                            <label>Location *</label>
                            <input type="text" id="restaurantLocation" placeholder="e.g. The Pearl, Doha" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Rating (1-5) *</label>
                            <input type="number" id="restaurantRating" min="1" max="5" step="0.1" value="4.5" required>
                        </div>
                        <div class="form-group">
                            <label>Initial Votes</label>
                            <input type="number" id="restaurantVotes" min="0" value="0">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Instagram URL</label>
                            <input type="url" id="restaurantInstagram" placeholder="https://www.instagram.com/...">
                        </div>
                        <div class="form-group">
                            <label>Google Maps URL *</label>
                            <input type="url" id="restaurantMaps" placeholder="https://maps.app.goo.gl/..." required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" id="restaurantPhone" placeholder="+974 XXXX XXXX">
                        </div>
                        <div class="form-group">
                            <label>Logo URL or Upload *</label>
                            <input type="text" id="restaurantLogo" placeholder="https://... or upload below">
                            <input type="file" id="logoUpload" accept="image/*" onchange="handleLogoUpload(event)" style="margin-top: 0.5rem;">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">
                            <span id="formBtnText">Add Restaurant</span>
                        </button>
                        <button type="button" onclick="resetForm()" class="btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Restaurant List -->
            <div class="admin-section">
                <div class="section-header">
                    <h2>Manage Restaurants</h2>
                    <button onclick="exportData()" class="btn-secondary">Export Data</button>
                </div>
                <div class="restaurant-list" id="restaurantList">
                    <!-- Generated by JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="admin-script.js"></script>
</body>
</html>
